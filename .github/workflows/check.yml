name: Test and build
on:
  push:
    branches: [main, qa/validation]
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: npm run check
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install browser test dependency (not an application dependency)
        run: |
          python -m pip install playwright==1.57.0
          python -m playwright install --with-deps chromium
      - name: Run real-browser regression
        run: |
          node scripts/dev.mjs > /tmp/rlmc-server.log 2>&1 &
          python tests/browser_smoke.py --url http://127.0.0.1:8787 --output artifacts
      - uses: actions/upload-artifact@v4
        if: success()
        with:
          name: static-site
          path: dist
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: browser-validation
          path: artifacts
          if-no-files-found: ignore
      - name: Package reproducible source snapshot
        if: always()
        run: git archive --format=zip HEAD -o source.zip
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: source-snapshot
          path: source.zip
